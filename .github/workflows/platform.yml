name: platform

# One platform's run of the gate, called once per platform by verify.yml.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.os }}
    # A run takes a few minutes; a hung restore or test stops here instead of at GitHub's six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: ./scripts/verify.sh
        shell: bash
