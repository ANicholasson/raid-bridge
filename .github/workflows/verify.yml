name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its run in progress; every push to main keeps its own result, so it gets a
# group of its own, because GitHub drops a waiting run when a newer one joins its group (CodeRabbit, PR #65).
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything but the memory adapter builds and tests on Windows and Linux (ADR-0002), so each runs the gate.
  # One job per platform rather than a matrix, so the gate below reads each platform's own result instead of the
  # matrix's combined one (CodeRabbit, PR #64).
  linux:
    uses: ./.github/workflows/platform.yml
    with:
      os: ubuntu-latest
  windows:
    uses: ./.github/workflows/platform.yml
    with:
      os: windows-latest
  # macOS is off until raid-bridge supports it: its runners waited 10 to 15 minutes to start, and PR runs were
  # cancelled while waiting (2026-11-13). To turn it back on, uncomment this job and its three lines in the gate below.
  # macos:
  #   uses: ./.github/workflows/platform.yml
  #   with:
  #     os: macos-latest

  # The one check branch rules require: green only when every platform is.
  verify:
    needs: [linux, windows] # , macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$LINUX" = success && test "$WINDOWS" = success # && test "$MACOS" = success
        env:
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          # MACOS: ${{ needs.macos.result }}
